name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create proper Flutter project structure
        run: |
          flutter create --project-name portfolio_tracker --org com.personal .
          # Keep our main.dart and pubspec if they exist
          if [ -f lib/main.dart ]; then
            cp lib/main.dart /tmp/main.dart.bak
          fi
          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml /tmp/pubspec.yaml.bak
          fi
          flutter create --project-name portfolio_tracker --org com.personal .
          if [ -f /tmp/main.dart.bak ]; then
            cp /tmp/main.dart.bak lib/main.dart
          fi
          if [ -f /tmp/pubspec.yaml.bak ]; then
            cp /tmp/pubspec.yaml.bak pubspec.yaml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
